[package]
name = "ecfft"
description = "Elliptic curve fast fourier transform for all prime fields"
repository = "https://github.com/andrewmilson/ecfft"
authors = ["Andrew Milson <andrew.j.milson@gmail.com>"]
keywords = ["cryptography", "finite-fields", "elliptic-curves", "fft"]
categories = ["cryptography"]
version = "0.1.0"
license = "MIT"
edition = "2021"

[[bench]]
name = "fftree"
path = "benches/fftree.rs"
harness = false

[[bench]]
name = "compareison"
path = "benches/comparison.rs"
harness = false

[dependencies]
ark-ff = { version = "0.5.0", features = ["parallel"] }
ark-serialize = { version = "0.5", features = [ "std" ] }
ark-poly = { version = "0.5.0", features = ["parallel"] }
num-bigint = "0.4"
num-integer = "0.1"
rand = "0.8"
rayon = "1.10.0"

[dev-dependencies]
criterion = "0.4"


[profile.bench]
codegen-units = 1
lto = true